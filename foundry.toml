[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.30"

# Invariant test configuration
[invariant]
runs = 256
depth = 15
fail_on_revert = false

[lint]
lint_on_build = false
exclude_lints = ["unsafe-typecast"]

# ============================================
# FILESYSTEM PERMISSIONS
# ============================================
# Allow deployment scripts to write to deployments directory
[[profile.default.fs_permissions]]
access = "read-write"
path = "./deployments"

# Allow economics tests to write model output files
[[profile.default.fs_permissions]]
access = "read-write"
path = "./test/economics"

# ============================================
# RPC ENDPOINTS
# ============================================
# These can be overridden with environment variables:
# - ETH_RPC_URL for default
# - FOUNDRY_RPC_URL_<NAME> for named endpoints

[rpc_endpoints]
localhost = "http://localhost:8545"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"

# ============================================
# ETHERSCAN API KEYS (for verification)
# ============================================
# Set BASESCAN_API_KEY environment variable

[etherscan]
base-sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
