[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Legacy codegen. Under via-IR, solc's output for a contract depends on every
# other file in the compilation unit, so the pruned standard-JSON that
# `forge --verify` submits does not reproduce the deployed bytecode
# (solc#14829). Keep this off so explorer verification works unassisted.
via_ir = false
solc_version = "0.8.36"
# Pinned: Foundry defaults to `osaka`, which Base has not activated. Targeting a
# fork the chain does not support risks emitting unsupported opcodes and makes
# the bytecode unreproducible for Etherscan verification.
evm_version = "cancun"
# Strip solc metadata so CREATE2(initcode) is identical across Foundry
# versions and CI. The live vault bytecode is already on-chain; this only
# affects newly compiled artifacts (the M4 registry pin).
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./src" },
]

# Invariant test configuration (full load — used for local runs; PR CI uses
# the reduced [profile.ci.invariant] below).
# fail_on_revert: the handler is revert-safe by construction (TEST-1), so any
# revert inside a run is a real regression and must fail the suite.
[invariant]
runs = 1024
depth = 50
fail_on_revert = true

# CI profile: fast PR feedback. Inherits everything from the default profile
# (optimizer, solc, evm_version) and only reduces the invariant load. The
# workflow sets FOUNDRY_PROFILE=ci; run the full default-profile load locally
# before releases (`forge test --match-path test/SapienVaultInvariant.t.sol`).
[profile.ci.invariant]
runs = 256
depth = 25
fail_on_revert = true

[lint]
lint_on_build = false
exclude_lints = ["unsafe-typecast"]

# ============================================
# FILESYSTEM PERMISSIONS
# ============================================
# ============================================
# RPC ENDPOINTS
# ============================================
# These can be overridden with environment variables:
# - ETH_RPC_URL for default
# - FOUNDRY_RPC_URL_<NAME> for named endpoints

[rpc_endpoints]
localhost = "http://localhost:8545"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"

# ============================================
# ETHERSCAN API KEYS (for verification)
# ============================================
# Etherscan API V2: one ETHERSCAN_API_KEY works across Basescan / Etherscan /
# etc. Do NOT point at api*.basescan.org (V1 — deprecated).

[etherscan]
# chainid must be in the URL query string for Etherscan API V2.
base-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api?chainid=84532" }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api?chainid=8453" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Halmos symbolic testing: requires AST in artifacts (ast = true).
# via_ir is compatible when ast is enabled (Foundry >= recent).
[profile.halmos]
via_ir = true
ast = true
out = "out-halmos"
