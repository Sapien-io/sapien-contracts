name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Resolves to [profile.ci] in foundry.toml: full build settings, reduced
  # invariant load (runs=256/depth=25); run the full default-profile load
  # locally before releases.
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge lint
        run: |
          forge lint src/
        id: lint

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  # T6: fail on any static-analysis finding not in the triaged baseline
  # (ci/aderyn-baseline.json). Slither remains a manual/deep-review tool — its
  # via-IR interaction is too flaky to gate merges on.
  static-analysis:
    name: Aderyn baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Aderyn
        run: |
          npm install -g @cyfrin/aderyn

      - name: Run Aderyn
        run: |
          aderyn -o aderyn-ci.json

      - name: Check against triaged baseline
        run: |
          python3 ci/check_aderyn.py aderyn-ci.json

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge coverage
        run: |
          forge coverage --ir-minimum --report lcov --report summary

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info


